<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🏆 Copa 2026 — Álbum de Figurinhas v8</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #0f1923 50%, #0a0a1a 100%);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: #f0f4f8; min-height: 100vh; padding-bottom: 70px;
  }
  button { font-family: inherit; cursor: pointer; }
  input  { font-family: inherit; }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 20px;
  }
  .setup-trophy { font-size: 56px; margin-bottom: 12px; }
  .setup-title  { font-size: 22px; font-weight: 900; color: #f59e0b; text-align: center; }
  .setup-sub    { font-size: 13px; color: #64748b; margin-top: 4px; margin-bottom: 32px; text-align: center; }

  .setup-card {
    width: 100%; max-width: 380px;
    background: #111827; border-radius: 16px; padding: 20px;
    border: 1px solid #1e293b;
  }
  .setup-label { font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; }

  /* Seletor de quantidade */
  .qtd-row { display: flex; gap: 8px; margin-bottom: 24px; }
  .btn-qtd {
    flex: 1; padding: 12px 4px; border-radius: 10px;
    border: 2px solid #2d3748; background: #1e293b;
    color: #64748b; font-size: 18px; font-weight: 800;
    transition: all 0.2s;
  }
  .btn-qtd.sel {
    border-color: #f59e0b; background: #f59e0b20;
    color: #f59e0b; box-shadow: 0 0 12px #f59e0b30;
  }

  /* Cores disponíveis */
  .CORES_DISP { display: none; }

  /* Inputs de nome */
  .nomes-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .nome-row { display: flex; align-items: center; gap: 10px; }
  .nome-emoji { font-size: 20px; width: 28px; text-align: center; }
  .nome-input {
    flex: 1; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid #2d3748; background: #1e293b;
    color: #f0f4f8; font-size: 15px; font-weight: 600;
    outline: none; transition: border-color 0.2s;
  }
  .nome-input:focus { border-color: #f59e0b; }
  .nome-input::placeholder { color: #475569; font-weight: 400; }

  .btn-comecar {
    width: 100%; padding: 14px; border-radius: 12px;
    border: none; background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000; font-size: 16px; font-weight: 900;
    letter-spacing: 0.3px; transition: opacity 0.2s;
  }
  .btn-comecar:disabled { opacity: 0.3; }

  .setup-rodape { font-size: 11px; color: #334155; margin-top: 20px; text-align: center; }

  /* ── APP SCREEN ── */
  #app-screen { display: none; }

  #header {
    background: linear-gradient(90deg, #1a1a2e, #16213e);
    border-bottom: 2px solid #f59e0b;
    padding: 12px 20px; text-align: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(245,158,11,0.2);
  }
  #header h1 { font-size: 18px; font-weight: 800; }
  #header p  { font-size: 10px; color: #94a3b8; margin-top: 2px; }

  #jogadores { display: flex; gap: 6px; padding: 12px 12px 0; }
  .btn-jogador {
    flex: 1; padding: 8px 6px; border-radius: 12px;
    border: 2px solid #2d3748; background: #1a1a2e;
    color: #64748b; transition: all 0.2s; text-align: center;
  }
  .btn-jogador.ativo { box-shadow: 0 0 16px var(--accent)44; }
  .btn-jogador .nome { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-jogador .contagem { font-size: 10px; margin-top: 2px; }
  .btn-jogador .barra-wrap { margin-top: 4px; height: 3px; border-radius: 2px; background: #1e293b; overflow: hidden; }
  .btn-jogador .barra-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .btn-jogador .pct { font-size: 9px; color: #64748b; margin-top: 2px; }

  #abas { display: flex; margin: 10px 12px 0; border-radius: 10px; overflow: hidden; border: 1px solid #2d3748; }
  .btn-aba {
    flex: 1; padding: 9px 4px; border: none; background: #111827;
    color: #64748b; font-size: 12px; font-weight: 400;
    border-bottom: 2px solid transparent;
  }
  .btn-aba.ativa { font-weight: 700; }

  #conteudo { padding: 12px 12px; }

  .legenda { display: flex; gap: 8px; margin-bottom: 12px; font-size: 11px; flex-wrap: wrap; align-items: center; }
  .legenda-item { display: flex; align-items: center; gap: 3px; }
  .legenda-box { width: 14px; height: 14px; border-radius: 3px; }
  .legenda-hint { color: #475569; font-size: 10px; margin-left: auto; }

  .sel-row { margin-bottom: 8px; }
  .sel-header {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 10px;
    background: linear-gradient(90deg, #1e293b, #111827);
    border: 1px solid #2d3748; text-align: left; transition: all 0.15s;
  }
  .sel-header.aberta { border-radius: 10px 10px 0 0; border-bottom: none; }
  .sel-flag { font-size: 18px; }
  .sel-info { flex: 1; min-width: 0; }
  .sel-nome { font-size: 13px; font-weight: 600; color: #e2e8f0; }
  .sel-sub  { font-size: 10px; color: #64748b; margin-top: 1px; }
  .sel-pct  { font-size: 12px; font-weight: 700; color: #94a3b8; }
  .sel-chevron { color: #475569; font-size: 12px; }

  .fig-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 5px; padding: 10px 6px;
    background: #0f1923; border-radius: 0 0 10px 10px;
    border: 1px solid #1e293b; border-top: none;
  }
  .fig-wrap { display: flex; flex-direction: column; gap: 2px; }
  .fig-btn {
    padding: 5px 2px; border-radius: 6px;
    border: 1.5px solid #2d3748; background: #1e293b;
    color: #475569; font-size: 11px; font-weight: 400; line-height: 1.2;
  }
  .fig-btn.tem1 { border-radius: 6px 6px 3px 3px; }
  .fig-qty { font-size: 10px; font-weight: 900; margin-top: 1px; }
  .fig-sub {
    padding: 2px; border-radius: 3px 3px 6px 6px;
    background: #0f1923; font-size: 13px; font-weight: 900; line-height: 1;
  }

  .info-box {
    background: #1e293b; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px; font-size: 12px; color: #94a3b8; border: 1px solid #334155;
  }
  .troca-card { background: #111827; border-radius: 12px; margin-bottom: 12px; border: 1px solid #1e293b; overflow: hidden; }
  .troca-card.temtrocas { border-color: #f59e0b50; }
  .troca-header { padding: 10px 14px; background: #0f1923; display: flex; align-items: center; justify-content: space-between; }
  .troca-header.temtrocas { background: linear-gradient(90deg, #1a1a0a, #111827); }
  .troca-par { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .troca-badge { background: #f59e0b; color: #000; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
  .troca-body { padding: 10px 14px; }
  .troca-dir { font-size: 11px; font-weight: 600; margin-bottom: 6px; }
  .troca-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .chip { border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 600; border: 1px solid transparent; font-family: inherit; }
  button.chip { -webkit-appearance: none; appearance: none; }

  .extras-card { background: #111827; border-radius: 12px; padding: 12px 14px; border: 1px solid #334155; margin-top: 8px; }
  .extras-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #1e293b; }
  .extras-row:last-child { border-bottom: none; }

  .stat-card { border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid transparent; }
  .stat-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .stat-barra-wrap { height: 8px; border-radius: 4px; background: #0f1923; overflow: hidden; margin-bottom: 10px; }
  .stat-barra { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .stat-mini { display: flex; gap: 8px; }
  .stat-mini-item { flex: 1; background: #0f1923; border-radius: 8px; padding: 6px 8px; text-align: center; }
  .stat-mini-val { font-size: 16px; font-weight: 800; }
  .stat-mini-label { font-size: 9px; color: #475569; margin-top: 1px; }

  .ranking-card { background: #111827; border-radius: 12px; padding: 12px 14px; border: 1px solid #1e293b; margin-bottom: 12px; }
  .ranking-titulo { font-size: 13px; font-weight: 700; color: #94a3b8; margin-bottom: 10px; }
  .ranking-sel-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #1e293b; }
  .ranking-sel-row:last-child { border-bottom: none; }
  .rank-barra-wrap { width: 60px; height: 4px; border-radius: 2px; background: #1e293b; }
  .rank-barra { height: 100%; border-radius: 2px; }
  .irmao-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid transparent; }

  .reset-area { margin-top: 20px; text-align: center; }
  .btn-reset { background: transparent; border: 1px solid #374151; color: #64748b; padding: 8px 16px; border-radius: 8px; font-size: 12px; }
  .btn-confirmar { background: #dc2626; border: none; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .btn-cancelar { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 8px 16px; border-radius: 8px; font-size: 12px; }
  .confirm-row { display: flex; gap: 8px; justify-content: center; }
  .btn-reconfigurar { background: transparent; border: 1px solid #374151; color: #475569; padding: 8px 16px; border-radius: 8px; font-size: 12px; margin-top: 8px; }

  #footer { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a1a; border-top: 1px solid #1e293b; padding: 8px 16px; text-align: center; font-size: 10px; color: #334155; }
  #toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #000; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
  #toast.show { opacity: 1; }

  /* ── MODAL ── */
  #modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center; padding: 20px;
  }
  #modal-overlay.show { display: flex; }
  #modal-box {
    background: #111827; border-radius: 16px; padding: 20px;
    width: 100%; max-width: 380px; border: 1px solid #1e293b;
  }
  .modal-titulo { font-size: 15px; font-weight: 800; color: #f0f4f8; margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: #64748b; margin-bottom: 16px; }
  .modal-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-btn-filho {
    flex: 1; min-width: 80px; padding: 10px 8px; border-radius: 10px;
    border: 2px solid #2d3748; background: #1e293b;
    color: #94a3b8; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all 0.15s;
  }
  .modal-btn-filho.sugerido { border-color: #22c55e; background: #22c55e20; color: #22c55e; }
  .modal-btn-cancelar {
    width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px;
    border: 1px solid #334155; background: transparent;
    color: #475569; font-size: 12px; cursor: pointer;
  }

  /* ── BADGE SESSÃO ── */
  #badge-sessao {
    display: none; position: fixed; bottom: 50px; right: 16px; z-index: 250;
    background: #f59e0b; color: #000; border-radius: 20px;
    padding: 6px 14px; font-size: 12px; font-weight: 900;
    box-shadow: 0 4px 12px rgba(245,158,11,0.4); cursor: pointer;
  }
</style>
</head>
<body>

<!-- TELA DE CONFIGURAÇÃO -->
<div id="setup-screen">
  <div class="setup-trophy">🏆</div>
  <div class="setup-title">Copa 2026</div>
  <div class="setup-sub">Álbum de Figurinhas Panini · 994 figurinhas</div>

  <div class="setup-card">
    <div class="setup-label">Quantos colecionadores?</div>
    <div class="qtd-row">
      <button class="btn-qtd" onclick="setQtd(1)">1</button>
      <button class="btn-qtd" onclick="setQtd(2)">2</button>
      <button class="btn-qtd sel" onclick="setQtd(3)">3</button>
      <button class="btn-qtd" onclick="setQtd(4)">4</button>
    </div>

    <div class="setup-label">Nomes dos colecionadores</div>
    <div class="nomes-grid" id="nomes-grid"></div>

    <button class="btn-comecar" id="btn-comecar" onclick="comecar()">Começar! ⚽</button>
  </div>

  <div class="setup-rodape">Seus dados ficam salvos neste celular</div>
</div>

<!-- APP PRINCIPAL -->
<div id="app-screen">
  <div id="header">
    <h1>🏆 <span style="color:#f59e0b">Copa 2026</span></h1>
    <p id="header-sub">Panini · 994 figurinhas · 52 seções</p>
    <button onclick="forcarAtualizacao()"
      style="margin-top:6px;background:transparent;border:1px solid #334155;color:#64748b;padding:3px 10px;border-radius:20px;font-size:10px;cursor:pointer">
      🔄 Atualizar app
    </button>
  </div>
  <div id="jogadores"></div>
  <div id="abas"></div>
  <div id="conteudo"></div>
  <div id="footer">⚽ Copa do Mundo FIFA 2026</div>
  <div id="toast">💾 Salvo!</div>
</div>

<!-- MODAL SUGESTÃO -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-titulo" id="modal-titulo"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-btns" id="modal-btns"></div>
    <button class="modal-btn-cancelar" onclick="fecharModal()">Cancelar — não consegui essa</button>
  </div>
</div>

<!-- BADGE SESSÃO -->
<div id="badge-sessao" onclick="verResumoSessao()">📦 Ver resumo</div>

// Retorna a lista de SELECOES na ordem escolhida (alfabética por sigla ou ordem do álbum)
function selecoesOrdenadas() {
  return ordemAlbum ? SELECOES : SELECOES_ALFA;
}

// Figurinhas extras "livres" de um filho (descontando o que será priorizado para os irmãos)
function calcularLivres(nome) {
  const nomes = config.nomes;
  const outros = nomes.filter(o => o !== nome);
  const resultado = [];
  SELECOES.forEach(sel => {
    state[nome][sel.id].forEach((qtd, idx) => {
      if (qtd >= 2) {
        const priorizados = distribuirExtras(nome, outros, sel.id, idx, qtd - 1);
        const qtdLivre = Math.max(0, (qtd - 1) - priorizados.length);
        if (qtdLivre > 0) {
          const numLabel = sel.inicio !== undefined ? (sel.inicio+idx === 0 ? "00" : sel.inicio+idx) : idx + 1;
          resultado.push({ sel, idx, numLabel, qtdLivre });
        }
      }
    });
  });
  return resultado;
}

// Consolida as repetidas livres dos 3 filhos para oferecer a um amigo
// Quando mais de 1 filho tem a mesma figurinha livre, define de quem ela "sai primeiro":
// o filho com álbum mais completo (maior %), empate por ordem alfabética do nome.
function calcularRepetidasParaAmigo() {
  const nomes = config.nomes;
  const mapa = {};
  nomes.forEach(nome => {
    calcularLivres(nome).forEach(item => {
      const key = `${item.sel.id}|${item.idx}`;
      if (!mapa[key]) mapa[key] = { sel: item.sel, idx: item.idx, numLabel: item.numLabel, porFilho: {} };
      mapa[key].porFilho[nome] = item.qtdLivre;
    });
  });
  return Object.values(mapa).map(item => {
    const candidatos = Object.keys(item.porFilho);
    const ordenados = [...candidatos].sort((a, b) => {
      const pctA = statsJogador(a).pct, pctB = statsJogador(b).pct;
      if (pctA !== pctB) return pctB - pctA; // álbum mais completo primeiro
      return a.localeCompare(b);
    });
    const total = candidatos.reduce((acc, n) => acc + item.porFilho[n], 0);
    return { sel: item.sel, idx: item.idx, numLabel: item.numLabel, total, origem: ordenados[0] };
  });
}

// Monta a lista ordenada de repetidas para amigos, já no critério de ordenação ativo
function listaRepetidasOrdenada() {
  const lista = calcularRepetidasParaAmigo();
  const ordem = selecoesOrdenadas();
  const posicao = Object.fromEntries(ordem.map((s, i) => [s.id, i]));
  return lista.sort((a, b) => {
    const pa = posicao[a.sel.id], pb = posicao[b.sel.id];
    if (pa !== pb) return pa - pb;
    return a.idx - b.idx;
  });
}

// Quantas unidades de uma figurinha já estão "em staging" (separadas, aguardando confirmação)
function qtdEmStaging(selId, idx) {
  return doacaoStaging.filter(it => it.selId === selId && it.idx === idx).length;
}

// Dado o que já está em staging, calcula quem ainda tem cópia livre dessa figurinha
// e devolve o próximo "de quem tirar" (álbum mais completo primeiro, empate alfabético)
function proximaOrigem(selId, idx) {
  const nomes = config.nomes;
  const jaContados = {}; // quantas unidades já reservadas por filho neste staging
  doacaoStaging.forEach(it => {
    if (it.selId === selId && it.idx === idx) {
      jaContados[it.origem] = (jaContados[it.origem] || 0) + 1;
    }
  });
  const candidatos = nomes.filter(nome => {
    const livre = calcularLivres(nome).find(l => l.sel.id === selId && l.idx === idx);
    const qtdLivre = livre ? livre.qtdLivre : 0;
    return qtdLivre - (jaContados[nome] || 0) > 0;
  });
  if (candidatos.length === 0) return null;
  return [...candidatos].sort((a, b) => {
    const pctA = statsJogador(a).pct, pctB = statsJogador(b).pct;
    if (pctA !== pctB) return pctB - pctA;
    return a.localeCompare(b);
  })[0];
}

// Toque numa figurinha da lista "Família" — separa para retirada (sem descontar ainda)
function adicionarParaDoacao(selId, idx) {
  const sel = SELECOES.find(s => s.id === selId);
  const numLabel = sel.inicio !== undefined ? (sel.inicio+idx === 0 ? "00" : sel.inicio+idx) : idx + 1;
  const origem = proximaOrigem(selId, idx);
  if (!origem) {
    const toast = document.getElementById("toast");
    toast.textContent = `⚠️ Sem mais cópias livres dessa figurinha`;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2000);
    return;
  }
  doacaoStaging.push({ selId, idx, sel, numLabel, origem });
  render();
}

// Confirma 1 item do painel "De quem tirar" — desconta de fato e remove da lista
function confirmarItemDoacao(i) {
  const item = doacaoStaging[i];
  if (!item) return;
  subFigTroca(item.origem, item.selId, item.idx);
  doacaoStaging.splice(i, 1);
  render();
}

// Confirma tudo de uma vez — "já peguei todas as figurinhas do bolinho"
function limparDoacaoStaging() {
  doacaoStaging.forEach(item => {
    if (state[item.origem][item.selId][item.idx] > 0) {
      state[item.origem][item.selId][item.idx]--;
    }
  });
  salvarEstado();
  doacaoStaging = [];
  render();
}

      return `<button onclick="adicionarParaDoacao('${item.sel.id}',${item.idx})"
        class="chip" style="background:${c.accent}15;color:${c.accent};border-color:${c.accent}40;cursor:${cheio?"default":"pointer"};${cheio?"opacity:0.5":""}">
        ${FLAGS[item.sel.id]} ${item.sel.sigla}-${item.numLabel}${total>1?` <span style="font-size:9px">×${restante}/${total}</span>`:""}

// Monta, por filho, a lista de extras livres já na ordem ativa
function listaExtrasIndividualPorFilho() {
  const nomes = config.nomes;
  const ordem = selecoesOrdenadas();
  const posicao = Object.fromEntries(ordem.map((s, i) => [s.id, i]));
  const porFilho = {};
  nomes.forEach(nome => {
    const lista = calcularLivres(nome).sort((a, b) => {
      const pa = posicao[a.sel.id], pb = posicao[b.sel.id];
      if (pa !== pb) return pa - pb;
      return a.idx - b.idx;
    });
    porFilho[nome] = lista;
  });
  return porFilho;
}

function exportarExtrasIndividualImagem() {
  const porFilho = listaExtrasIndividualPorFilho();
  const nomes = config.nomes;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const largura = 900;
  const paddingH = 40;
  const alturaHeader = 100;
  const alturaNome = 40;
  const alturaLinha = 30;
  const paddingV = 30;

  // Pré-calcula quantas linhas cada filho vai precisar (quebra de texto)
  ctx.font = "18px Arial";
  const wrapWidth = largura - paddingH * 2;
  const blocos = nomes.map(nome => {
    const lista = porFilho[nome];
    const itens = lista.map(it => it.qtdLivre > 1 ? `${FLAGS[it.sel.id]} ${it.sel.sigla}-${it.numLabel} ×${it.qtdLivre}` : `${FLAGS[it.sel.id]} ${it.sel.sigla}-${it.numLabel}`);
    const texto = itens.length > 0 ? itens.join("   ") : "Nenhuma extra livre";
    // Quebra simples por largura
    const palavras = texto.split("   ");
    const linhas = [];
    let linhaAtual = "";
    palavras.forEach(p => {
      const teste = linhaAtual ? linhaAtual + "   " + p : p;
      if (ctx.measureText(teste).width > wrapWidth && linhaAtual) {
        linhas.push(linhaAtual);
        linhaAtual = p;
      } else {
        linhaAtual = teste;
      }
    });
    if (linhaAtual) linhas.push(linhaAtual);
    return { nome, linhas };
  });

  const alturaTotal = alturaHeader + paddingV + blocos.reduce((acc, b) => acc + alturaNome + b.linhas.length * alturaLinha + 16, 0);
  canvas.width = largura;
  canvas.height = alturaTotal;

  ctx.fillStyle = "#0f1923";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#3b82f6";
  ctx.fillRect(0, 0, canvas.width, 6);

  ctx.font = "bold 28px Arial";
  ctx.fillStyle = "#3b82f6";
  ctx.fillText("🔁 Extras livres — Família Gonçalves", paddingH, 48);
  ctx.font = "20px Arial";
  ctx.fillStyle = "#f59e0b";
  ctx.fillText(`Copa 2026 Panini · ${new Date().toLocaleDateString("pt-BR")}`, paddingH, 80);

  let y = alturaHeader + paddingV;
  blocos.forEach(bloco => {
    const c = corNome(bloco.nome);
    ctx.font = "bold 22px Arial";
    ctx.fillStyle = c.accent;
    ctx.fillText(bloco.nome, paddingH, y);
    y += alturaNome - 6;
    ctx.font = "18px Arial";
    ctx.fillStyle = "#cbd5e1";
    bloco.linhas.forEach(linha => {
      ctx.fillText(linha, paddingH, y);
      y += alturaLinha;
    });
    y += 16;
  });

  const link = document.createElement("a");
  link.download = `extras-individual.png`;
  link.href = canvas.toDataURL();
  link.click();
  alert("✅ Imagem salva!");
}

      <div style="font-size:13px;font-weight:700;color:#a855f7">👥 Família — faltantes consolidados</div>
      <button onclick="exportarConsolidado()" style="background:#a855f725;border:1px solid #a855f7;color:#a855f7;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer">📋 Exportar</button>
    </div>`;
  selecoesOrdenadas().forEach(s => {
    const faltantes = [];
    state[nomes[0]][s.id].forEach((_, idx) => {
      const qtdFalta = nomes.filter(n => state[n][s.id][idx] === 0).length;
      const nasSessaoCount = sessaoTroca.filter(i => i.selId === s.id && i.idx === idx).length;
      const qtdRestante = qtdFalta - nasSessaoCount;
      if (qtdRestante > 0) {
        const numLabel = s.inicio !== undefined ? (s.inicio+idx === 0 ? "00" : s.inicio+idx) : idx+1;
        faltantes.push({ numLabel, qtdFalta: qtdRestante, idx, selId: s.id, selNome: s.nome, flag: FLAGS[s.id] });
      }
    });
    if (faltantes.length > 0) {
      html += `<div style="padding:6px 0;border-bottom:1px solid #1e293b">
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">${FLAGS[s.id]} ${s.nome}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${faltantes.map(f => `
            <button onclick="abrirModalFigurinha('${f.selId}',${f.idx},'${f.numLabel}','${f.selNome}','${f.flag}')"
              style="background:${f.qtdFalta>1?"#f59e0b20":"#1e293b"};color:${f.qtdFalta>1?"#f59e0b":"#94a3b8"};border:1px solid ${f.qtdFalta>1?"#f59e0b50":"#334155"};border-radius:4px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer">
              ${f.numLabel}${f.qtdFalta>1?`<span style="font-size:9px;font-weight:400"> (×${f.qtdFalta})</span>`:""}
            </button>`).join("")}
        </div>
      </div>`;
    }
  });
  return html + `</div>`;
}

// Cada item: { selId, idx, para, numLabel, selNome, flag }
let sessaoTroca = [];

function carregarSessao() {
  try {
    const raw = localStorage.getItem("copa2026-sessao");
    if (raw) sessaoTroca = JSON.parse(raw);
  } catch(e) { sessaoTroca = []; }

}

function salvarSessao() {
  try { localStorage.setItem("copa2026-sessao", JSON.stringify(sessaoTroca)); } catch(e) {}
  atualizarBadgeSessao();
}

function atualizarBadgeSessao() {
  const badge = document.getElementById("badge-sessao");
  if (!badge) return;
  if (sessaoTroca.length > 0) {
    badge.style.display = "block";
    badge.textContent = `📦 Resumo (${sessaoTroca.length})`;
  } else {
    badge.style.display = "none";
  }
}

// Calcula quem tem menos figurinhas de uma seleção (para sugestão)
function sugerirDestinatario(selId, idx) {
  const nomes = config.nomes;
  const precisam = nomes.filter(n => state[n][selId][idx] === 0);
  if (precisam.length === 0) return null;
  const totalAlbum = (nome) => SELECOES.reduce((acc, s) => acc + state[nome][s.id].filter(q => q >= 1).length, 0);
  return [...precisam].sort((a, b) => {
    // 1. Menos figurinhas naquela seleção
    const ta = state[a][selId].filter(q => q >= 1).length;
    const tb = state[b][selId].filter(q => q >= 1).length;
    if (ta !== tb) return ta - tb;
    // 2. Menos figurinhas no álbum total
    const totalA = totalAlbum(a), totalB = totalAlbum(b);
    if (totalA !== totalB) return totalA - totalB;
    // 3. Alfabético
    return a.localeCompare(b);
  })[0];
}

// Abre modal para confirmar para qual filho vai a figurinha
function abrirModalFigurinha(selId, idx, numLabel, selNome, flag) {
  const nomes = config.nomes;
  const nomeAtivo = config.nomes[jogadorAtivo];
  const precisam = nomes.filter(n => state[n][selId][idx] === 0);
  if (precisam.length === 0) return;

  // Se está na visão individual (filho ativo precisa), confirma direto para ele
  if (precisam.includes(nomeAtivo)) {
    confirmarFigurinhaSessao(selId, idx, nomeAtivo, numLabel, selNome, flag);
    return;
  }

  // Visão consolidada família: mais de 1 precisa e nenhum é o ativo
  const sugerido = sugerirDestinatario(selId, idx);
  if (precisam.length === 1) {
    confirmarFigurinhaSessao(selId, idx, precisam[0], numLabel, selNome, flag);
    return;
  }

  document.getElementById("modal-titulo").textContent = `${flag} ${selNome}-${numLabel}`;
  document.getElementById("modal-sub").textContent =
    `Sugestão: ${sugerido} (menos figurinhas desta seleção)`;

  const btns = document.getElementById("modal-btns");
  btns.innerHTML = precisam.map(nome => {
    const c = corNome(nome);
    const ehSugerido = nome === sugerido;
    return `<button class="modal-btn-filho${ehSugerido?" sugerido":""}"
      style="${ehSugerido?"":`border-color:${c.accent}40;color:${c.accent}`}"
      onclick="confirmarFigurinhaSessao('${selId}',${idx},'${nome}','${numLabel}','${selNome}','${flag}')">
      ${nome}${ehSugerido?" ✓":""}
    </button>`;
  }).join("");

  document.getElementById("modal-overlay").classList.add("show");
}

function fecharModal() {
  document.getElementById("modal-overlay").classList.remove("show");
}

function confirmarFigurinhaSessao(selId, idx, para, numLabel, selNome, flag) {
  fecharModal();
  sessaoTroca.push({ selId, idx, para, numLabel, selNome, flag });
  salvarSessao();
  render();
  const toast = document.getElementById("toast");
  toast.textContent = `✅ ${flag} ${selNome}-${numLabel} → ${para}`;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

function verResumoSessao() {
  abaAtiva = "sessao";
  selecaoAberta = null;

}

function confirmarSessao() {
  // Aplica todas as figurinhas da sessão no álbum
  sessaoTroca.forEach(item => {
    if (state[item.para][item.selId][item.idx] < 99) {
      state[item.para][item.selId][item.idx]++;
    }
  });
  salvarEstado();
  localStorage.removeItem("copa2026-sessao");
  sessaoTroca = [];
  atualizarBadgeSessao();
  abaAtiva = "album";
  render();
  const toast = document.getElementById("toast");
  toast.textContent = "✅ Álbum atualizado!";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

function cancelarSessao() {
  if (!confirm("Cancelar a sessão? As figurinhas não serão adicionadas ao álbum.")) return;
  localStorage.removeItem("copa2026-sessao");
  sessaoTroca = [];
  atualizarBadgeSessao();
  abaAtiva = "album";
  render();
}

function exportarResumoSessao() {

    b.classList.toggle("sel", i+1 === n);
  });

}

function renderNomesGrid() {
  const grid = document.getElementById("nomes-grid");
  const placeholders = ["Primeiro nome","Segundo nome","Terceiro nome","Quarto nome"];
  grid.innerHTML = Array.from({length: qtdSel}, (_,i) => `
    <div class="nome-row">
      <span class="nome-emoji">${EMOJIS[i]}</span>
      <input class="nome-input" id="nome-${i}" type="text" maxlength="12"
        placeholder="${placeholders[i]}" oninput="validarNomes()" />

  validarNomes();
  // foca no primeiro campo
  setTimeout(() => { const el = document.getElementById("nome-0"); if(el) el.focus(); }, 100);

function validarNomes() {
  const btn = document.getElementById("btn-comecar");
  let ok = true;
  for(let i = 0; i < qtdSel; i++) {
    const el = document.getElementById("nome-"+i);
    if (!el || el.value.trim() === "") { ok = false; break; }
  }
  btn.disabled = !ok;
}

function comecar() {
  const nomes = [];
  for(let i = 0; i < qtdSel; i++) {
    nomes.push(document.getElementById("nome-"+i).value.trim());
  }
  const cores = PALETA.slice(0, qtdSel);
  config = { nomes, cores };
  state = criarEstadoVazio();
  salvarConfig();
  iniciarApp();
}

// ─── ESTADO ───────────────────────────────────────────────────────────────────
function criarEstadoVazio() {
  const s = {};
  config.nomes.forEach(j => {
    s[j] = {};
    SELECOES.forEach(sel => { s[j][sel.id] = new Array(sel.qtd).fill(0); });
  });
  return s;
}

function salvarConfig() {
  try { localStorage.setItem("copa2026-config", JSON.stringify(config)); } catch(e) {}
}

function salvarEstado() {
  try {
    localStorage.setItem("copa2026-state", JSON.stringify(state));
    const toast = document.getElementById("toast");
    if (toast) {
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1200);
    }
  } catch(e) {}
}

function carregarDados() {
  try {
    const rawConfig = localStorage.getItem("copa2026-config");
    const rawState  = localStorage.getItem("copa2026-state");
    if (rawConfig) {
      config = JSON.parse(rawConfig);
      // Sempre atualiza as cores do código — nunca usa cores salvas
      config.cores = PALETA.slice(0, config.nomes.length);
      // salva config já com cores atualizadas
      salvarConfig();
      if (!state) state = {};
      config.nomes.forEach(j => {
        if (!state[j]) state[j] = {};
        SELECOES.forEach(sel => {
          if (!state[j][sel.id] || state[j][sel.id].length !== sel.qtd) {
            state[j][sel.id] = new Array(sel.qtd).fill(0);
          }
        });
      });
      if (rawState) state = JSON.parse(rawState);
      config.nomes.forEach(j => {
        if (!state[j]) state[j] = {};
        SELECOES.forEach(sel => {
          if (!state[j][sel.id] || state[j][sel.id].length !== sel.qtd) {
            state[j][sel.id] = new Array(sel.qtd).fill(0);
          }
        });
      });
      return true;
    }
  } catch(e) {}
  return false;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function corDoJogador(idx) { return config.cores[idx] || PALETA[0]; }
function idxJogador(nome)  { return config.nomes.indexOf(nome); }
function corNome(nome)     { return corDoJogador(idxJogador(nome)); }

function statsJogador(nome) {
  let tem = 0, extras = 0;
  SELECOES.forEach(s => {
    state[nome][s.id].forEach(q => {
      if (q >= 1) tem++;
      if (q >= 2) extras += q - 1;
    });
  });
  return { tem, extras, faltam: TOTAL - tem, pct: Math.round(tem / TOTAL * 100) };
}

function corBotao(qtd, accent) {
  if (qtd === 0) return { bg:"#1e293b", borda:"#2d3748", txt:"#475569" };
  if (qtd === 1) return { bg:accent+"25", borda:accent, txt:accent };
  if (qtd === 2) return { bg:"#f59e0b25", borda:"#f59e0b", txt:"#f59e0b" };
  return { bg:"#f9731625", borda:"#f97316", txt:"#f97316" };
}

    }).filter(n => n !== null);
    if (faltantes.length > 0) {
      linhasSecoes.push({ flag: FLAGS[s.id], nome: s.nome, nums: faltantes.join(", ") });
    }
  });

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const largura = 900;
  const paddingH = 40;
  const alturaHeader = 100;
  const alturaLinha = 38;
  const paddingV = 30;

  canvas.width = largura;
  canvas.height = alturaHeader + linhasSecoes.length * alturaLinha + paddingV * 2;

  // Fundo
  ctx.fillStyle = "#0f1923";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Barra colorida topo
  ctx.fillStyle = c.accent;
  ctx.fillRect(0, 0, canvas.width, 6);

  // Título
  ctx.font = "bold 30px Arial";
  ctx.fillStyle = c.accent;
  ctx.fillText(`📋 Faltantes — ${nome}`, paddingH, 50);

  ctx.font = "20px Arial";
  ctx.fillStyle = "#f59e0b";
  ctx.fillText(`Copa 2026 Panini · ${new Date().toLocaleDateString("pt-BR")}`, paddingH, 82);

  // Linhas de seções
  linhasSecoes.forEach((linha, i) => {
    const y = alturaHeader + paddingV + i * alturaLinha;
    const par = i % 2 === 0;
    if (par) {
      ctx.fillStyle = "#ffffff08";
      ctx.fillRect(0, y - 26, canvas.width, alturaLinha);
    }
    ctx.font = "22px Arial";
    ctx.fillStyle = "#e2e8f0";
    ctx.fillText(`${linha.flag} ${linha.nome}:`, paddingH, y);

    ctx.font = "20px Arial";
    ctx.fillStyle = "#94a3b8";
    // Calcula posição após o nome
    const nomeWidth = ctx.measureText(`${linha.flag} ${linha.nome}: `).width;
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText(linha.nums, paddingH + nomeWidth + 4, y);
  });

  // Rodapé
  ctx.font = "16px Arial";
  ctx.fillStyle = "#334155";
  ctx.fillText("Copa 2026 — Família Gonçalves", paddingH, canvas.height - 10);

  const link = document.createElement("a");
  link.download = `faltantes-${nome.toLowerCase()}.png`;
  link.href = canvas.toDataURL();
  link.click();
  alert("✅ Imagem salva! Compartilhe no WhatsApp.");
}

// ── TROCAS ───────────────────────────────────────────────────────────────────

// Quantas figurinhas faltam para completar uma seleção específica
function faltamNaSel(nome, selId) {
  const s = SELECOES.find(x => x.id === selId);
  return s.qtd - state[nome][selId].filter(q => q >= 1).length;
}

// Priorização por seleção:
// 1. Quem tem MENOS figurinhas naquela seleção tem prioridade (mais precisa = mais justo)
// 2. Empate: ordem alfabética pelo nome
function distribuirExtras(de, destinatarios, selId, idx, qtdExtra) {
  const precisam = destinatarios.filter(p => state[p][selId][idx] === 0);
  if (precisam.length === 0) return [];
  const ordenados = [...precisam].sort((a, b) => {
    // 1. Menos figurinhas naquela seleção
    const temSelA = state[a][selId].filter(q => q >= 1).length;
    const temSelB = state[b][selId].filter(q => q >= 1).length;
    if (temSelA !== temSelB) return temSelA - temSelB;
    // 2. Empate: menos figurinhas no álbum total
    const temTotalA = SELECOES.reduce((acc, s) => acc + state[a][s.id].filter(q => q >= 1).length, 0);
    const temTotalB = SELECOES.reduce((acc, s) => acc + state[b][s.id].filter(q => q >= 1).length, 0);
    if (temTotalA !== temTotalB) return temTotalA - temTotalB;
    // 3. Empate no total: alfabético
    return a.localeCompare(b);
  });
  const resultado = [];
  let sobraram = qtdExtra;
  for (const dest of ordenados) {
    if (sobraram <= 0) break;
    resultado.push(dest);
    sobraram--;
  }
  return resultado;
}

function confirmarTroca(de, para, selId, idx) {
  if (state[de][selId][idx] >= 2 && state[para][selId][idx] === 0) {
    state[de][selId][idx]--;
    state[para][selId][idx]++;
    salvarEstado();
    renderConteudo();
    renderJogadores();
  }
}

function confirmarTodasTrocas(A, B) {
  const nomes = config.nomes;
  // A dá para B (respeitando prioridade)
  SELECOES.forEach(s => {
    state[A][s.id].forEach((qA, idx) => {
      const extras = qA - 1;
      if (extras <= 0) return;
      const outros = nomes.filter(o => o !== A);
      const priorizados = distribuirExtras(A, outros, s.id, idx, extras);
      if (priorizados.includes(B) && state[B][s.id][idx] === 0) {
        state[A][s.id][idx]--;
        state[B][s.id][idx]++;
      }
    });
  });
  // B dá para A (respeitando prioridade)
  SELECOES.forEach(s => {
    state[B][s.id].forEach((qB, idx) => {
      const extras = qB - 1;
      if (extras <= 0) return;
      const outros = nomes.filter(o => o !== B);
      const priorizados = distribuirExtras(B, outros, s.id, idx, extras);
      if (priorizados.includes(A) && state[A][s.id][idx] === 0) {
        state[B][s.id][idx]--;
        state[A][s.id][idx]++;
      }
    });
  });
  salvarEstado();
  renderConteudo();
  renderJogadores();
}

function renderTrocas() {
  const nomes = config.nomes;
  const pares = [];
  for (let i = 0; i < nomes.length; i++) {
    for (let j = i+1; j < nomes.length; j++) {
      const A = nomes[i], B = nomes[j];
      const podeAdarB = [], podeBdarA = [];
      SELECOES.forEach(s => {
        const totalAlbum = (nome) => SELECOES.reduce((acc, sel) => acc + state[nome][sel.id].filter(q => q >= 1).length, 0);
        const prioridade = (x, y, selId) => {
          const tx = state[x][selId].filter(q => q >= 1).length;
          const ty = state[y][selId].filter(q => q >= 1).length;
          if (tx !== ty) return tx - ty;
          const totalX = totalAlbum(x), totalY = totalAlbum(y);
          if (totalX !== totalY) return totalX - totalY;
          return x.localeCompare(y);
        };
        state[A][s.id].forEach((qA, idx) => {
          const qB = state[B][s.id][idx];
          const extras = qA - 1;
          if (extras <= 0 || qB !== 0) return;
          const outrosQueNaoTem = nomes.filter(o => o !== A && o !== B && state[o][s.id][idx] === 0);
          const outrosOrdenados = [...outrosQueNaoTem].sort((x, y) => prioridade(x, y, s.id));
          const temNaSelB = state[B][s.id].filter(q => q >= 1).length;
          const totalB = totalAlbum(B);
          let extrasUsadosAntes = 0;
          for (const outro of outrosOrdenados) {
            const temOutro = state[outro][s.id].filter(q => q >= 1).length;
            const totalOutro = totalAlbum(outro);
            const outroPrioritario =
              temOutro < temNaSelB ||
              (temOutro === temNaSelB && totalOutro < totalB) ||
              (temOutro === temNaSelB && totalOutro === totalB && outro.localeCompare(B) < 0);
            if (outroPrioritario) extrasUsadosAntes++;
          }
          const extrasParaB = Math.max(0, extras - extrasUsadosAntes);
          if (extrasParaB > 0) podeAdarB.push({ s, idx, qtd: extrasParaB });
        });
        state[B][s.id].forEach((qB, idx) => {
          const qA = state[A][s.id][idx];
          const extras = qB - 1;
          if (extras <= 0 || qA !== 0) return;
          const outrosQueNaoTem = nomes.filter(o => o !== B && o !== A && state[o][s.id][idx] === 0);
          const outrosOrdenados = [...outrosQueNaoTem].sort((x, y) => prioridade(x, y, s.id));
          const temNaSelA = state[A][s.id].filter(q => q >= 1).length;
          const totalA = totalAlbum(A);
          let extrasUsadosAntes = 0;
          for (const outro of outrosOrdenados) {
            const temOutro = state[outro][s.id].filter(q => q >= 1).length;
            const totalOutro = totalAlbum(outro);
            const outroPrioritario =
              temOutro < temNaSelA ||
              (temOutro === temNaSelA && totalOutro < totalA) ||
              (temOutro === temNaSelA && totalOutro === totalA && outro.localeCompare(A) < 0);
            if (outroPrioritario) extrasUsadosAntes++;
          }
          const extrasParaA = Math.max(0, extras - extrasUsadosAntes);
          if (extrasParaA > 0) podeBdarA.push({ s, idx, qtd: extrasParaA });
        });
      });
      pares.push({ A, B, podeAdarB, podeBdarA });
    }
  }

  const numLabel = (s, idx) => {
    if (s.inicio !== undefined) {
      // FWC: numeração contínua a partir do início definido
      const n = s.inicio + idx;
      return n === 0 ? "00" : n;
    }
    return idx + 1;
  };

  const cardsHtml = pares.map(({ A, B, podeAdarB, podeBdarA }) => {
    const cA = corNome(A), cB = corNome(B);
    const total = podeAdarB.length + podeBdarA.length;

    // Ordena alfabeticamente pela sigla, depois pelo número
    const ordenar = (lista) => [...lista].sort((a, b) => {
      if (a.s.sigla < b.s.sigla) return -1;
      if (a.s.sigla > b.s.sigla) return 1;
      return a.idx - b.idx;
    });

    const chips = (lista, de, para, cor) => ordenar(lista).map(f =>
      `<span class="chip" style="background:${cor}20;color:${cor};border-color:${cor}50;display:inline-flex;align-items:center;gap:4px">
        ${FLAGS[f.s.id]} ${f.s.sigla}-${numLabel(f.s, f.idx)}${f.qtd>1?`<span style="color:#f59e0b"> ×${f.qtd}</span>`:""}
        <button onclick="confirmarTroca('${de}','${para}','${f.s.id}',${f.idx})"
          style="background:#22c55e;border:none;color:#000;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:900;cursor:pointer">✓</button>
      </span>`).join("");

    const body = total > 0 ? `<div class="troca-body">
      ${podeAdarB.length > 0 ? `
        <div class="troca-dir" style="color:${cA.accent}">${A} dá para ${B} (${podeAdarB.length}):</div>
        <div class="troca-chips">${chips(podeAdarB, A, B, cA.accent)}</div>` : ""}
      ${podeBdarA.length > 0 ? `
        <div class="troca-dir" style="color:${cB.accent}">${B} dá para ${A} (${podeBdarA.length}):</div>
        <div class="troca-chips">${chips(podeBdarA, B, A, cB.accent)}</div>` : ""}
      <div style="margin-top:10px;text-align:center">
        <button onclick="confirmarTodasTrocas('${A}','${B}')"
          style="background:linear-gradient(135deg,#22c55e,#16a34a);border:none;color:#000;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:900;cursor:pointer">
          ✓ Confirmar todas as trocas ${A} ↔ ${B}
        </button>
      </div>
    </div>` : "";

    return `<div class="troca-card${total>0?" temtrocas":""}">
      <div class="troca-header${total>0?" temtrocas":""}">
        <div class="troca-par">
          <span style="color:${cA.accent}">${A}</span>
          <span style="color:#475569">↔</span>
          <span style="color:${cB.accent}">${B}</span>
        </div>
        ${total>0
          ? `<span class="troca-badge">${total} figurinha${total>1?"s":""}</span>`
          : `<span style="color:#475569;font-size:12px">sem trocas agora</span>`}
      </div>${body}
    </div>`;
  }).join("");

  const sortFn = ordemAlbum
    ? (a,b) => SELECOES.indexOf(a.sel) - SELECOES.indexOf(b.sel) || a.idx - b.idx
    : (a,b) => a.sel.sigla.localeCompare(b.sel.sigla) || a.idx - b.idx;

  const extrasHtml = nomes.map(j => {
    const c = corNome(j);
    const s = statsJogador(j);
    const livresLista = calcularLivres(j);

    const chipsLivres = livresLista.length > 0
      ? `<div class="troca-chips" style="margin-top:6px">
          ${[...livresLista].sort(sortFn).map(f => {
            return `<span class="chip" style="background:${c.accent}15;color:${c.accent};border-color:${c.accent}40;display:inline-flex;align-items:center;gap:4px">
              <button onclick="addFigTroca('${j}','${f.sel.id}',${f.idx})"
                style="background:#22c55e;border:none;color:#000;border-radius:4px;padding:2px 7px;font-size:13px;font-weight:900;cursor:pointer;line-height:1">+</button>
              ${FLAGS[f.sel.id]} ${f.sel.sigla}-${f.numLabel}${f.qtdLivre>1?`<span style="color:#f59e0b"> ×${f.qtdLivre}</span>`:""}
              <button onclick="subFigTroca('${j}','${f.sel.id}',${f.idx})"
                style="background:#ef4444;border:none;color:#fff;border-radius:4px;padding:2px 7px;font-size:13px;font-weight:900;cursor:pointer;line-height:1">−</button>
            </span>`;
          }).join("")}
        </div>` : "";

    return `<div style="padding:10px 0;border-bottom:1px solid #1e293b">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${livresLista.length>0?4:0}px">
        <span style="color:${c.accent};font-weight:700;font-size:14px">${j}</span>
        <div style="text-align:right">
          <span style="color:#f59e0b;font-weight:700;font-size:15px">${s.extras}</span>
          <span style="color:#475569;font-size:11px"> extras totais</span>
          ${livresLista.length > 0
            ? `<span style="color:#64748b;font-size:11px"> · ${livresLista.reduce((acc, f) => acc + f.qtdLivre, 0)} livres</span>`
            : `<span style="color:#334155;font-size:11px"> · nenhuma livre</span>`}
        </div>
      </div>
      ${chipsLivres}
    </div>`;
  }).join("");

  return `
    <div class="info-box">💡 Mostra extras que um colecionador pode dar ao outro. <strong style="color:#f59e0b">Troquem entre vocês primeiro!</strong></div>
    ${cardsHtml}
    ${renderOrdemToggle()}
    <div class="extras-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div class="ranking-titulo" style="margin:0">🔁 Extras livres para trocar fora</div>
        <div style="display:flex;gap:6px">
          <button onclick="setVisaoExtras('individual')" style="
            padding:5px 11px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;
            border:1px solid ${visaoTrocaExtras==='individual'?'#3b82f6':'#334155'};
            background:${visaoTrocaExtras==='individual'?'#3b82f625':'transparent'};
            color:${visaoTrocaExtras==='individual'?'#3b82f6':'#64748b'}">
            👤 Individual
          </button>
          <button onclick="setVisaoExtras('familia')" style="
            padding:5px 11px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;
            border:1px solid ${visaoTrocaExtras==='familia'?'#a855f7':'#334155'};
            background:${visaoTrocaExtras==='familia'?'#a855f725':'transparent'};
            color:${visaoTrocaExtras==='familia'?'#a855f7':'#64748b'}">
            👥 Família
          </button>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">
        <button onclick="${visaoTrocaExtras==='individual'?'exportarExtrasIndividualTexto':'exportarRepetidasAmigoTexto'}()" style="padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid #1d4ed8;background:#1e40af25;color:#3b82f6">📋 Texto</button>
        <button onclick="${visaoTrocaExtras==='individual'?'exportarExtrasIndividualImagem':'exportarRepetidasAmigoImagem'}()" style="padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#94a3b8">🖼️ Imagem</button>
      </div>
      ${visaoTrocaExtras === 'individual' ? extrasHtml : renderRepetidasAmigo()}
    </div>`;
}

// ── STATS ────────────────────────────────────────────────────────────────────
function renderStats() {
  const c = corDoJogador(jogadorAtivo);
  const nomeAtivo = config.nomes[jogadorAtivo];

  const cardsHtml = config.nomes.map((j, i) => {
    const s = statsJogador(j);
    const cj = corDoJogador(i);
    return `<div class="stat-card" style="background:linear-gradient(135deg,${cj.bg},#111827);border-color:${cj.accent}40;box-shadow:0 4px 16px ${cj.accent}15">
      <div class="stat-top">
        <div>
          <div style="font-size:18px;font-weight:800;color:${cj.accent}">${j}</div>
          <div style="font-size:11px;color:#64748b;margin-top:1px">${s.pct}% completo</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:26px;font-weight:900;color:#f0f4f8">${s.tem}</div>
          <div style="font-size:10px;color:#64748b">/ 994</div>
        </div>
      </div>
      <div class="stat-barra-wrap">
        <div class="stat-barra" style="width:${s.pct}%;background:linear-gradient(90deg,${cj.accent},${cj.accent}90)"></div>
      </div>
      <div class="stat-mini">
        ${[["Faltam",s.faltam,"#94a3b8"],["Extras",s.extras,"#f59e0b"],["Únicas",s.tem,cj.accent]].map(([l,v,cor])=>
          `<div class="stat-mini-item">
            <div class="stat-mini-val" style="color:${cor}">${v}</div>
            <div class="stat-mini-label">${l}</div>
          </div>`).join("")}
      </div>
    </div>`;
  }).join("");

  const topSels = [...SELECOES].map(s => {
    const arr = state[nomeAtivo][s.id];
    const tem = arr.filter(v => v >= 1).length;
    return { ...s, tem, pct: Math.round(tem/s.qtd*100) };
  }).sort((a,b) => b.pct - a.pct).slice(0, 8);

  const topSelsHtml = topSels.map(s => `
    <div class="ranking-sel-row">
      <span style="font-size:16px">${FLAGS[s.id]||"🏳️"}</span>
      <span style="font-size:12px;flex:1;color:#cbd5e1">${s.nome}</span>
      <div class="rank-barra-wrap">
        <div class="rank-barra" style="width:${s.pct}%;background:${s.pct===100?"#22c55e":c.accent}"></div>
      </div>
      <span style="font-size:11px;font-weight:700;min-width:28px;text-align:right;color:${s.pct===100?"#22c55e":"#94a3b8"}">${s.pct}%</span>
    </div>`).join("");

  const rankIrmaos = config.nomes.map((j,i) => ({ j, i, ...statsJogador(j) })).sort((a,b) => b.tem - a.tem);
  const medals = ["🥇","🥈","🥉","🏅"];
  const rankHtml = config.nomes.length > 1 ? rankIrmaos.map((item, rank) => {
    const cj = corDoJogador(item.i);
    const ativo = item.i === jogadorAtivo;
    return `<div class="irmao-row" style="background:${ativo?cj.accent+"15":"#0f1923"};border-color:${ativo?cj.accent+"40":"transparent"}">
      <span style="font-size:18px">${medals[rank]||"🏅"}</span>
      <span style="font-weight:700;color:${cj.accent};flex:1">${item.j}</span>
      <div style="text-align:right">
        <div style="font-weight:800;font-size:16px;color:#f0f4f8">${item.tem}</div>
        <div style="font-size:10px;color:#64748b">${item.pct}% · ${item.extras} extras</div>
      </div>
    </div>`;
  }).join("") : "";

  const resetHtml = confirmandoReset
    ? `<div class="confirm-row">
        <button class="btn-confirmar" onclick="resetar()">Confirmar reset</button>
        <button class="btn-cancelar" onclick="cancelarReset()">Cancelar</button>
      </div>`
    : `<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <button class="btn-reset" onclick="pedirReset()">🗑️ Zerar figurinhas</button>
        <button class="btn-reconfigurar" onclick="reconfigurar()">⚙️ Mudar nomes / quantidade</button>
      </div>`;

  const backupHtml = `
    <div style="background:#111827;border-radius:12px;padding:14px;border:1px solid #1e293b;margin-top:12px">
      <div style="font-size:13px;font-weight:700;color:#94a3b8;margin-bottom:10px">💾 Backup dos dados</div>
      <div style="font-size:11px;color:#64748b;margin-bottom:12px">
        Exporte seus dados e salve no Notes. Se limpar o Safari, importe de volta e nada se perde.
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="exportarDados()"
          style="background:linear-gradient(135deg,#1e40af,#1d4ed8);border:none;color:#fff;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">
          📤 Exportar — copiar dados
        </button>
        <button onclick="document.getElementById('import-area').style.display='block'"
          style="background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:10px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer">
          📥 Importar — restaurar backup
        </button>
        <div id="import-area" style="display:none;margin-top:4px">
          <textarea id="import-text" placeholder="Cole aqui o texto do backup..."
            style="width:100%;height:80px;background:#0f1923;border:1px solid #334155;border-radius:8px;color:#f0f4f8;padding:8px;font-size:11px;resize:none;margin-bottom:6px"></textarea>
          <div style="display:flex;gap:8px">
            <button onclick="importarDados()"
              style="flex:1;background:#22c55e;border:none;color:#000;padding:8px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer">
              ✓ Restaurar
            </button>
            <button onclick="document.getElementById('import-area').style.display='none'"
              style="flex:1;background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:8px;border-radius:8px;font-size:12px;cursor:pointer">
              Cancelar
            </button>
          </div>
        </div>
      </div>
    </div>`;

  return `
    ${cardsHtml}
    <div class="ranking-card">
      <div class="ranking-titulo">🏅 Seleções mais completas — ${nomeAtivo}</div>
      ${topSelsHtml}
    </div>
    ${config.nomes.length > 1 ? `<div class="ranking-card"><div class="ranking-titulo">🥇 Ranking</div>${rankHtml}</div>` : ""}
    <div class="reset-area">${resetHtml}</div>
    ${backupHtml}`;
}

// ─── AÇÕES ────────────────────────────────────────────────────────────────────
function setJogador(i) { jogadorAtivo = i; selecaoAberta = null; visaoFamilia = false; submenuAberto = null; render(); }
function setAba(a)     { abaAtiva = a; selecaoAberta = null; render(); }
function toggleSel(id) { selecaoAberta = selecaoAberta === id ? null : id; renderConteudo(); }

function addFig(selId, idx) {
  const nome = config.nomes[jogadorAtivo];
  if (state[nome][selId][idx] < 99) {
    state[nome][selId][idx]++;
    salvarEstado(); renderConteudo(); renderJogadores();
  }
}
function subFig(selId, idx) {
  const nome = config.nomes[jogadorAtivo];
  if (state[nome][selId][idx] > 0) {
    state[nome][selId][idx]--;
    salvarEstado(); renderConteudo(); renderJogadores();
  }
}

function exportarDados() {
  try {
    const backup = {
      config: JSON.parse(localStorage.getItem("copa2026-config")),
      state:  JSON.parse(localStorage.getItem("copa2026-state")),
      versao: "copa2026v1",
      data:   new Date().toLocaleDateString("pt-BR")
    };
    const texto = JSON.stringify(backup);
    // Tenta copiar para clipboard
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(() => {
        alert("✅ Copiado! Cole no Notes ou WhatsApp para guardar.");
      }).catch(() => {
        prompt("Selecione tudo e copie:", texto);
      });
    } else {
      prompt("Selecione tudo e copie:", texto);
    }
  } catch(e) {
    alert("Erro ao exportar: " + e.message);
  }
}

function importarDados() {
  try {
    const texto = document.getElementById("import-text").value.trim();
    if (!texto) { alert("Cole o texto do backup primeiro."); return; }
    const backup = JSON.parse(texto);
    if (backup.versao !== "copa2026v1") { alert("Backup inválido."); return; }
    localStorage.setItem("copa2026-config", JSON.stringify(backup.config));
    localStorage.setItem("copa2026-state",  JSON.stringify(backup.state));
    if (carregarDados()) {
      iniciarApp();
      alert("✅ Dados restaurados com sucesso!");
    }
  } catch(e) {
    alert("Erro ao importar. Verifique se o texto está correto.");
  }
}
function addFigTroca(nome, selId, idx) {
  if (state[nome][selId][idx] < 99) {
    state[nome][selId][idx]++;
    salvarEstado();
    renderConteudo();
    renderJogadores();
  }
}

function subFigTroca(nome, selId, idx) {
  if (state[nome][selId][idx] > 0) {
    state[nome][selId][idx]--;
    salvarEstado();
    renderConteudo();
    renderJogadores();
  }
}

function forcarAtualizacao() {
  window.location.reload(true);
}

function pedirReset()   { confirmandoReset = true;  renderConteudo(); }
function cancelarReset(){ confirmandoReset = false; renderConteudo(); }

function resetar() {
  state = criarEstadoVazio();
  confirmandoReset = false;
  localStorage.removeItem("copa2026-state");
  render();
}

function reconfigurar() {
  // limpa tudo e volta para o setup
  localStorage.removeItem("copa2026-config");
  localStorage.removeItem("copa2026-state");
  config = null; state = null;
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("setup-screen").style.display = "flex";
  setQtd(3);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
// Tenta carregar dados salvos
if (carregarDados()) {
  iniciarApp();
} else {
  // Mostra setup
  setQtd(3);
}
</script>
</body>
</html>
